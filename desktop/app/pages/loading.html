<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VoiceBank AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06080f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }
    .logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #06b6d4, #10b981);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg { width: 32px; height: 32px; color: white; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 28px; }

    .services {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 8px 28px;
      margin-bottom: 20px;
      -webkit-app-region: no-drag;
    }
    .svc {
      display: flex; align-items: center; gap: 9px;
      font-size: 12.5px; color: #94a3b8;
    }
    .svc .name { width: 42px; font-weight: 600; color: #cbd5e1; }
    .svc .state { color: #64748b; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #334155; flex-shrink: 0;
    }
    .svc.ok .dot { background: #10b981; }
    .svc.ok .state { color: #10b981; }
    .svc.wait .dot { background: #f59e0b; animation: blink 1.2s ease-in-out infinite; }
    .svc.wait .state { color: #f59e0b; }
    .svc.bad .dot { background: #f87171; }
    .svc.bad .state { color: #f87171; }

    .spinner {
      width: 26px; height: 26px;
      border: 3px solid #1e293b;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status { font-size: 11px; color: #475569; margin-top: 14px; text-align: center; line-height: 1.6; }
    .hint { font-size: 11px; color: #3f4c5f; margin-top: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="logo">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
  </div>
  <h1>VoiceBank AI</h1>
  <div class="sub">Đang khởi động hệ thống…</div>

  <div class="services">
    <div class="svc" id="svc-stt"><span class="dot"></span><span class="name">STT</span><span class="state">chờ…</span></div>
    <div class="svc" id="svc-llm"><span class="dot"></span><span class="name">LLM</span><span class="state">chờ…</span></div>
    <div class="svc" id="svc-tts"><span class="dot"></span><span class="name">TTS</span><span class="state">chờ…</span></div>
    <div class="svc" id="svc-rag"><span class="dot"></span><span class="name">RAG</span><span class="state">chờ…</span></div>
  </div>

  <div class="spinner"></div>
  <div class="status" id="status">Đang chờ backend trả lời…</div>
  <div class="hint">F5-TTS mất 2-3 phút để nạp ở lần chạy đầu</div>

  <script>
    // Poll /api/health qua IPC và chuyển vào app ngay khi backend sẵn sàng.
    // Hiện trạng thái TỪNG dịch vụ thay vì mỗi bộ đếm giây: TTS nạp lâu nhất
    // nên biết nó "đang nạp" khác hẳn với "chết" - trước đây chỉ thấy con số
    // tăng dần, không biết còn sống hay đã hỏng.
    let elapsed = 0;
    const statusEl = document.getElementById('status');

    function setSvc(id, cls, text) {
      const el = document.getElementById(id);
      el.className = 'svc ' + cls;
      el.querySelector('.state').textContent = text;
    }

    // Backend chỉ trả /api/health khi app_state đã dựng xong. Trước lúc đó
    // không có thông tin gì, nên để cả 4 ở trạng thái chờ.
    function render(health) {
      if (!health) {
        const phase = elapsed < 20 ? 'Đang chạy script khởi động…'
                    : elapsed < 60 ? 'Đang nạp model, chưa có phản hồi…'
                    : 'Vẫn đang nạp model (F5-TTS lâu nhất)…';
        statusEl.textContent = `${phase} (${elapsed}s)`;
        return false;
      }

      const s = health.services || {};
      setSvc('svc-stt', s.stt === 'ok' ? 'ok' : 'bad', s.stt === 'ok' ? 'ok' : 'chưa lên');
      setSvc('svc-llm', s.llm === 'ok' ? 'ok' : 'bad', s.llm === 'ok' ? 'ok' : 'chưa lên');
      setSvc('svc-tts', s.tts === 'loaded' ? 'ok' : 'wait', s.tts === 'loaded' ? 'đã nạp' : 'đang nạp…');
      setSvc('svc-rag', 'ok', s.rag || 'ok');

      statusEl.textContent = `Backend: ${health.status || '?'} (${elapsed}s)`;
      // Vào app khi backend đã ok VÀ TTS nạp xong - vào sớm hơn thì lượt đầu câm.
      return health.status === 'ok' && s.tts === 'loaded';
    }

    const timer = setInterval(async () => {
      elapsed += 2;
      try {
        const health = await window.electronAPI.checkHealth();
        if (render(health)) {
          clearInterval(timer);
          statusEl.textContent = 'Sẵn sàng! Đang mở app…';
          location.href = await window.electronAPI.getBackendUrl();
        }
      } catch (e) { /* backend chưa lên, thử lại */ }
    }, 2000);
  </script>
</body>
</html>
